<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Specs // Polaris</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="Styles/specs.css">

    <link rel="icon" href="Images/pfp.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="Images/pfp.png">

    <meta name="theme-color" content="#020812">
    <meta name="description" content="Polaris' stream rig and gear.">

    <meta property="og:title" content="Polaris">
    <meta property="og:description" content="Official Website For Polaris.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://polaris1374.github.io/Links/Images/meta.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <script src="Scripts/stars.js" defer></script>
    <script src="Scripts/nebula.js" defer></script>
    <script src="Scripts/parallax.js" defer></script>
    <script src="Scripts/cursor.js" defer></script>
</head>

<body>

    <div id="cursor"></div>
    <div id="cursorRing"></div>

    <div class="noise"></div>
    <div class="glow-orb o1"></div>
    <div class="glow-orb o2"></div>
    <div class="corner-deco tl"></div>
    <div class="corner-deco tr"></div>
    <div class="corner-deco bl"></div>
    <div class="corner-deco br"></div>

    <div class="specs-wrapper">

        <header class="specs-header">
            <div class="specs-brand">
                <div class="specs-logo-placeholder">
                    <img src="Images/pfp.png" alt="Polaris" class="icon-replacement">
                </div>
                <div class="specs-brand-text">
                    <span class="specs-site-name">Polaris</span>
                    <span class="specs-page-label">Rig &amp; Gear</span>
                </div>
            </div>
        </header>

        <div class="specs-divider"></div>

        <div>
            <div class="section-label">Hardware</div>
            <div class="spec-list">

                <div class="spec-card">
                    <div class="spec-badge"><i class="fa-solid fa-microchip"></i></div>
                    <div>
                        <div class="spec-key">CPU</div>
                        <div class="spec-val">Ryzen 5 5500</div>
                    </div>
                </div>

                <div class="spec-card">
                    <div class="spec-badge"><i class="fa-solid fa-server"></i></div>
                    <div>
                        <div class="spec-key">Motherboard</div>
                        <div class="spec-val">MSI A520M-A PRO</div>
                    </div>
                </div>

                <div class="spec-card">
                    <div class="spec-badge"><i class="fa-solid fa-gamepad"></i></div>
                    <div>
                        <div class="spec-key">GPU</div>
                        <div class="spec-val">MAXSUN Arc B580</div>
                    </div>
                </div>

                <div class="spec-card">
                    <div class="spec-badge"><i class="fa-solid fa-memory"></i></div>
                    <div>
                        <div class="spec-key">RAM</div>
                        <div class="spec-val">16GB DDR4 @ 3200MHz</div>
                    </div>
                </div>

                <div class="spec-card">
                    <div class="spec-badge"><i class="fa-solid fa-box"></i></div>
                    <div>
                        <div class="spec-key">Case</div>
                        <div class="spec-val">Antec AX20 Elite</div>
                    </div>
                </div>

            </div>
        </div>

        <div>
            <div class="section-label">Setup</div>
            <div class="spec-list">

                <div class="spec-card">
                    <div class="spec-badge"><i class="fa-solid fa-desktop"></i></div>
                    <div>
                        <div class="spec-key">Monitor</div>
                        <div class="spec-val">Samsung G5 G53F</div>
                    </div>
                </div>

                <div class="spec-card">
                    <div class="spec-badge"><i class="fa-solid fa-headphones"></i></div>
                    <div>
                        <div class="spec-key">Headphones</div>
                        <div class="spec-val">KZ EDX Pros</div>
                    </div>
                </div>

                <div class="spec-card">
                    <div class="spec-badge"><i class="fa-solid fa-computer-mouse"></i></div>
                    <div>
                        <div class="spec-key">Mouse</div>
                        <div class="spec-val">Logitech G502 Hero</div>
                    </div>
                </div>

                <div class="spec-card">
                    <div class="spec-badge"><i class="fa-solid fa-microphone"></i></div>
                    <div>
                        <div class="spec-key">Mic</div>
                        <div class="spec-val">Elgato Wave:1</div>
                    </div>
                </div>

            </div>
        </div>

        <div class="specs-back">
            <a href="main.html">back to links</a>
        </div>

    </div>

</body>

</html>
